<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar — MegaSOAT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
    <style>
        /* Topbar minimalista para login */
        .login-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 36px;
            background: transparent;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: .85rem;
            font-weight: 500;
            transition: color .2s;
        }
        .back-link:hover { color: var(--text); }

        /* Centrado vertical completo */
        .login-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Card de login */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.035);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 18px;
            padding: 40px 36px;
            box-shadow:
                0 0 0 1px rgba(var(--accent-rgb),0.06),
                0 24px 64px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.07);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: -80px; right: -80px;
            width: 220px; height: 220px;
            background: radial-gradient(circle, rgba(var(--accent-rgb),0.10), transparent 65%);
            pointer-events: none;
        }

        /* Logo en card */
        .login-logo {
            text-align: center;
            margin-bottom: 6px;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
        }
        .login-logo span { color: var(--accent); }
        .login-subtitle {
            text-align: center;
            color: var(--muted);
            font-size: .85rem;
            margin-bottom: 28px;
        }

        /* Inputs mejorados */
        .login-field {
            margin-bottom: 14px;
        }
        .login-field input#captchaAnswer {
        width: 100%;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 12px 16px;
        color: var(--text);
        font-size: .95rem;
        font-family: inherit;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
        }
         .login-field input#captchaAnswer:focus {
        border-color: rgba(var(--accent-rgb),0.5);
        box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.08);
         }

        .login-field label {
            display: block;
            font-size: .75rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 7px;
        }
        .login-field input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text);
            font-size: .95rem;
            font-family: inherit;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .login-field input:focus {
            border-color: rgba(var(--accent-rgb),0.5);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.08);
        }

        /* Captcha */
        .captcha-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }
        .captcha-display {
            flex: 1;
            padding: 11px 16px;
            border-radius: 10px;
            border: 1px solid rgba(var(--accent-rgb),0.2);
            background: rgba(var(--accent-rgb),0.05);
            color: var(--accent);
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 4px;
        }
        .btn-refresh {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--muted);
            padding: 11px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: .9rem;
            transition: all .2s;
            white-space: nowrap;
        }
        .btn-refresh:hover { background: rgba(255,255,255,0.1); color: #fff; }

        /* Botón login */
        .btn-login {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 14px;
            font-size: .97rem;
            border-radius: 10px;
            margin-top: 4px;
        }

        /* Mensaje de estado */
        .login-message {
            margin-top: 14px;
            text-align: center;
            font-size: .87rem;
            min-height: 20px;
            transition: all .2s;
        }
        .login-message.error   { color: var(--danger); }
        .login-message.success { color: var(--accent); }

        /* Divider + link */
        .login-footer {
            text-align: center;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size: .83rem;
            color: var(--muted);
        }
        .login-footer a { color: var(--accent); }
    </style>
</head>
<body class="login-page">

    <!-- Topbar minimalista: solo logo + volver -->
    <header class="login-topbar">
        <a href="/" class="brand" style="text-decoration:none">Mega<span>SOAT</span></a>
        <a href="/" class="back-link">← Volver al inicio</a>
    </header>

    <!-- Contenido centrado -->
    <div class="login-center">
        <div class="login-card">

            <div class="login-logo">Mega<span>SOAT</span></div>
            <p class="login-subtitle">Portal empresarial · Acceso seguro</p>

            <div class="login-field">
                <label>Correo electrónico</label>
                <input id="email" type="email" 
                       autocomplete="email">
            </div>

            <div class="login-field">
                <label>Contraseña</label>
                <input id="password" type="password" 
                       autocomplete="current-password">
            </div>

            <div class="login-field">
                <label for="captchaAnswer">Código de verificación</label>
                <div class="captcha-row">
                    <div class="captcha-display" id="captchaCode"></div>
                    <button class="btn-refresh" id="refreshCaptcha" type="button">↻ Nuevo</button>
                </div>
                <!-- Campo de texto con mismo diseño que usuario/contraseña -->
                <input id="captchaAnswer" type="text" placeholder="Ingrese el código" required>
                <input type="hidden" id="captchaId" name="captchaId" value="">
            </div>



            <button id="loginButton" class="primary-button btn-login">Iniciar sesión</button>

            <div id="message" class="login-message"></div>

            <div class="login-footer">
                ¿Necesitas verificar tu SOAT? <a href="/portal.html">Búscalo aquí</a>
            </div>
        </div>
    </div>

    <script src="/js/animations.js" defer></script>
    <script>
        const button = document.getElementById('loginButton');
        const msgEl = document.getElementById('captchaField');
        const captchaField = document.getElementById('captchaField');
        const captchaCode = document.getElementById('captchaCode');
        const refreshBtn = document.getElementById('refreshCaptcha');
        const messageEl = document.getElementById('message');
        let captchaId = null, captchaAnswer = null;

        async function loadCaptcha() {
            try {
                const r = await fetch('/api/auth/captcha');
                if (!r.ok) throw new Error();
                const j = await r.json();
                captchaId = j.id;
                captchaAnswer = j.question;
                captchaCode.textContent = j.question;
                captchaField.style.display = 'block';
            } catch(e) {
                captchaField.style.display = 'none';
                captchaId = null;
            }
        }

        loadCaptcha();
        refreshBtn.addEventListener('click', e => { e.preventDefault(); loadCaptcha(); });

        button.addEventListener('click', async () => {
            messageEl.textContent = '';
            messageEl.className = 'login-message';
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) { showMsg('Completa todos los campos', 'error'); return; }

            button.textContent = 'Verificando...';
            button.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, captchaId, captchaAnswer })
                });
                if (!res.ok) {
                    if (res.status === 400) throw new Error('Captcha expirado — toca ↻ Nuevo');
                    if (res.status === 401) throw new Error('Correo o contraseña incorrectos');
                    throw new Error('Error de autenticación');
                }
                const body = await res.json();
                localStorage.setItem('megaSoatToken', body.token);
                localStorage.setItem('megaSoatUser', body.email);
                showMsg('✓ Acceso concedido', 'success');
                setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);
            } catch(err) {
                showMsg(err.message || 'Error de autenticación', 'error');
                button.textContent = 'Iniciar sesión';
                button.disabled = false;
                loadCaptcha();
            }
        });

        document.getElementById('password').addEventListener('keyup', e => {
            if (e.key === 'Enter') button.click();
        });

        function showMsg(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'login-message ' + type;
        }
    </script>
</body>
</html>
